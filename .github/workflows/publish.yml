name: Publish

# On every push to main: run the CI gate, then publish BOTH ports at the version
# in their own manifest — the TypeScript port to npm and the Python port to PyPI.
# Each publish is idempotent (a version already on the registry is skipped, not
# failed), so re-running a partially-failed release is safe.
#
# Auth is TOKENLESS via OIDC trusted publishing on all three — no secrets.
# One-time config, PER PACKAGE (after any repo rename, redo all of these):
#   npm:  npmjs.com → captchakraken → Settings → Trusted Publisher →
#         GitHub Actions: CaptchaKraken/CaptchaKraken, workflow publish.yml
#   npm:  npmjs.com → captchakraken-mcp → same, as its own entry. The
#         `captchakraken` entry does NOT cover it; trusted publishers are scoped
#         to one package name.
#   PyPI: pypi.org → captchakraken → Publishing → add a GitHub trusted publisher:
#         CaptchaKraken/CaptchaKraken, workflow publish.yml
#
# A BRAND-NEW npm package cannot be configured before it exists: npm's trusted
# publisher settings live on the package page. So the FIRST publish of
# captchakraken-mcp needs a one-off `npm publish` from a logged-in machine (or a
# pending-publisher entry created on npmjs.com); every release after that is
# tokenless like the rest. This is a one-time cost and it is why publish-mcp can
# legitimately fail on the very first run while the other two jobs succeed.
#
# BETAS FROM DEV. A push to dev publishes the manifests' version as a pre-release
# built from that commit: `X.Y.Zb<run>` on PyPI, `X.Y.Z-beta.<run>` on npm under
# the `beta` dist-tag. Neither registry hands a pre-release to a plain install
# (`pip install captchakraken` and `npm i captchakraken` keep the last final), so
# a beta reaches only those who ask for it: `pip install --pre captchakraken`,
# `npm i captchakraken@beta`. Once X.Y.Z itself is on npm, dev pushes still at
# X.Y.Z publish nothing until the manifests move on. The MCP server is not
# pre-released. Betas must run from THIS file: both registries trust
# publish.yml by name, so a separate beta workflow would be refused.
on:
  push:
    branches: [main, dev]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (CI gate)
    uses: ./.github/workflows/ci.yml

  # What this push publishes: main publishes the manifests as they are; dev
  # publishes a pre-release of them, unless that version is already final.
  version:
    name: Version to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      npm: ${{ steps.v.outputs.npm }}
      pypi: ${{ steps.v.outputs.pypi }}
      dist_tag: ${{ steps.v.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./js/package.json').version")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            printf 'publish=true\nnpm=%s\npypi=%s\ndist_tag=latest\n' "$BASE" "$BASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "captchakraken@$BASE" version >/dev/null 2>&1; then
            echo "captchakraken@$BASE is already final; no beta until the manifests move past it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          N="$GITHUB_RUN_NUMBER"
          printf 'publish=true\nnpm=%s\npypi=%s\ndist_tag=beta\n' "$BASE-beta.$N" "${BASE}b$N" >> "$GITHUB_OUTPUT"
          echo "beta: npm $BASE-beta.$N, PyPI ${BASE}b$N"

  publish-npm:
    name: Publish npm (captchakraken)
    needs: [verify, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC trusted publishing + provenance
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 24 bundles npm
          # 11.16, so take it as-is: self-upgrading npm inside setup-node's
          # toolcache leaves a half-updated tree where `publish --provenance`
          # can't resolve sigstore.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install (skip python bootstrap)
        run: npm ci --ignore-scripts
        env:
          CAPTCHA_KRAKEN_SKIP_PYTHON_SETUP: '1'
      - name: Stamp a beta's version
        if: needs.version.outputs.dist_tag == 'beta'
        env:
          NPM_VER: ${{ needs.version.outputs.npm }}
          PY_VER: ${{ needs.version.outputs.pypi }}
        # The bundled Python engine is stamped too, so it reports the build it is.
        run: |
          npm version "$NPM_VER" --no-git-tag-version --allow-same-version
          sed -i -E "s/^version *= *\".*\"/version = \"$PY_VER\"/" ../python/pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$PY_VER\"/" ../python/src/captchakraken/__init__.py
      - name: Build (bundles python engine + compiles TS)
        run: npm run build
      - name: Publish (idempotent)
        env:
          DIST_TAG: ${{ needs.version.outputs.dist_tag }}
        # npm refuses a pre-release without an explicit --tag, and a beta must
        # never take `latest`.
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "captchakraken@$VER" version >/dev/null 2>&1; then
            echo "captchakraken@$VER already published — skipping."
          else
            npm publish --access public --provenance --tag "$DIST_TAG"
          fi

  # The MCP server is a SEPARATE package on its own version line (0.1.0 while
  # the client is at 2.4.0) and is deliberately not locked to the client's
  # number: tying them together would mean cutting an MCP release every time the
  # solver changes. What ties them is the repo and the release train, not the
  # integer — and `npm view` below reads this manifest independently anyway.
  #
  # It is NOT a dependency of the `captchakraken` package on purpose. The client
  # has one runtime dep; the MCP needs the MCP SDK and zod. Those belong on the
  # one-time onboarding path, not on every browser-driver install.
  publish-mcp:
    name: Publish npm (captchakraken-mcp)
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC trusted publishing + provenance
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 for the same reason as publish-npm: trusted publishing needs
          # npm >= 11.5.1, and self-upgrading npm inside the toolcache breaks
          # `publish --provenance`.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Publish (idempotent)
        # The `else` branch is wrapped because npm reports "you are not the
        # trusted publisher for this package" as a 404 on the PUT:
        #
        #   npm error 404 Not Found - PUT https://registry.npmjs.org/captchakraken-mcp
        #   npm error 404  The requested resource 'captchakraken-mcp@0.1.1' could
        #   npm error 404  not be found or you do not have permission to access it.
        #
        # Which reads as "the package does not exist" — and it plainly does, at
        # 0.1.0, published by hand in July. That wording cost a real diagnosis on
        # 2026-08-23: `captchakraken` published in the same run, from the same
        # workflow, with the same OIDC, so the obvious readings (bad auth, broken
        # release) were all wrong. The one true reading is the narrowest one, and
        # npm will not say it.
        #
        # Trusted publishers are scoped to ONE package name (see the header), so
        # a package first published by hand has no entry until someone adds it.
        # Say so, and keep failing.
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "captchakraken-mcp@$VER" version >/dev/null 2>&1; then
            echo "captchakraken-mcp@$VER already published — skipping."
            exit 0
          fi
          if npm publish --access public --provenance; then
            exit 0
          fi
          if npm view captchakraken-mcp version >/dev/null 2>&1; then
            echo "::error::captchakraken-mcp EXISTS on npm ($(npm view captchakraken-mcp version)) \
          but this workflow is not its trusted publisher, which npm reports as a 404 on the PUT. \
          Fix: npmjs.com -> captchakraken-mcp -> Settings -> Trusted Publisher -> GitHub Actions, \
          repository CaptchaKraken/CaptchaKraken, workflow publish.yml. The captchakraken entry does \
          NOT cover this package. Then re-run this job."
          fi
          exit 1

  publish-pypi:
    name: Publish PyPI (captchakraken)
    needs: [verify, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC trusted publishing to PyPI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Stamp a beta's version
        if: needs.version.outputs.dist_tag == 'beta'
        env:
          PY_VER: ${{ needs.version.outputs.pypi }}
        run: |
          sed -i -E "s/^version *= *\".*\"/version = \"$PY_VER\"/" python/pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$PY_VER\"/" python/src/captchakraken/__init__.py
          grep -n "^version" python/pyproject.toml
      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (skips existing versions)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
          skip-existing: true

  # THE VERSION NUMBER DOES NOT IDENTIFY THE BUILD, so the tag has to.
  #
  # The manifests are bumped when a release is OPENED, not when its content
  # lands, so every commit between the bump and the merge reports the version
  # that eventually ships. Measured on 3.1.0: the pre-fix commit and the
  # published one both read `3.1.0` in both manifests, six commits apart — and
  # "what version am I on" is the first thing anyone checks, so it hands back
  # the number they hoped for either way. A tag is created HERE, by the job that
  # publishes, so the only thing that can carry it is the commit that shipped.
  #
  # Not `needs: publish-mcp`: the MCP server is on its own version line, and the
  # header explains why its publish can legitimately fail while the client's
  # succeeds. The client's tag must not be hostage to that.
  tag:
    name: Tag the release
    needs: [version, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag this commit as its version, once
        # Idempotent like the publishes above, and for the same reason: a push to
        # main that changes nothing else re-runs this job, and a release that is
        # already tagged is done, not broken. The check asks the REMOTE rather
        # than the local refs, because this checkout is shallow and carries no
        # tags — asking locally would answer "no tag" every time and then fail on
        # the push.
        # A beta is tagged by its npm version (v5.0.0-beta.12), which names the
        # same build as its PyPI one (5.0.0b12).
        env:
          NPM_VER: ${{ needs.version.outputs.npm }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./js/package.json').version")
          PY=$(sed -nE 's/^version *= *"(.*)"/\1/p' python/pyproject.toml | head -1)
          if [ "$VER" != "$PY" ]; then
            echo "::error::js/package.json says $VER and python/pyproject.toml says $PY. Both ports publish from this commit, so one tag cannot name two versions."
            exit 1
          fi
          VER="$NPM_VER"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "v$VER is already tagged — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VER" -m "$VER" -m "Published to npm and PyPI by the publish workflow from this commit."
          git push origin "v$VER"
          echo "tagged v$VER at $(git rev-parse --short HEAD)"
