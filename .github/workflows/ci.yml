name: CI

# Fast, hermetic checks for both ports: no GPU, no network, no model weights.
# The core guard is grid detection (the foundation of every solve) plus a
# TypeScript build check on the browser solver.
#
# `dev` IS LISTED, and it was not. A pull request into `dev` ran nothing here at
# all — checked 2026-08-28 on #16, whose only check was GitGuardian — so work
# landed on the integration branch ungated and first met CI at the `dev -> main`
# promotion, where a failure blocks the RELEASE instead of the change that
# caused it. These jobs are hermetic and run on ubuntu-latest, which is free for
# a public repo, so there was never a cost argument for the narrower trigger.
on:
  pull_request:
    branches: [main, dev]
  # Reused by publish.yml as the pre-publish gate on main pushes.
  workflow_call:

jobs:
  # STAGE 1: seconds, no installs, no network. Tests run cheapest first, and a
  # run that is going to fail should fail on the stage that names the fix. A
  # missing FILE_PURPOSES.md entry is one line to add, and there is no reason to
  # spend a full test run discovering it — so nothing below starts until this
  # passes.
  #
  # The gate reads `git ls-files` and fails in BOTH directions: a tracked file
  # with no entry, and an entry naming a path that is gone. A stale map is worse
  # than no map, because it still gets trusted.
  codebase-map:
    name: Stage 1 — FILE_PURPOSES.md matches git ls-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: FILE_PURPOSES.md matches git ls-files, both directions
        run: node .github/scripts/check-file-purposes.mjs

  python-regression:
    name: Regression gate (Python)
    runs-on: ubuntu-latest
    needs: codebase-map
    # Job level, not step level: a step's own `env:` is not in scope for that
    # step's own `if:`, so guarding the upload on it there would have made the
    # step silently unreachable rather than conditional.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      # BOTH LEGS ALWAYS REPORT. With fail-fast on, a 3.10 failure cancels 3.12
      # mid-install and destroys its result, so a run that should have told us
      # "3.10 cannot resolve numpy, 3.12 is fine" told us only the first half.
      # The legs are minutes long and free on a public repo; the information is
      # worth more than the cancelled runner time.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install client + dev tools (no GPU/serve stack)
        # `.[dev]` pulls the lightweight client deps (onnxruntime, pydantic, requests,
        # …) plus pytest and pytest-cov, all at the exact versions pinned in
        # pyproject.toml. NOT the `serve` extra (vllm/torch), so this stays
        # hermetic and fast. The versions live in the manifest and nowhere else —
        # naming them here too is how the two drift apart.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # STAGE 5: the coverage threshold, measured over the run above rather than
      # by a second run of the same tests. The floor lives in pyproject.toml
      # ([tool.coverage.report] fail_under) so a local run enforces exactly what
      # CI does. It is set at the value the suite actually measures, not at the
      # 90% the spec asks for — a gate that is red the day it lands blocks every
      # PR and teaches people to route around it. TRIBAL_KNOWLEDGE.md records
      # the real distance to 90%.
      #
      # Enforced on BOTH legs. Both were measured on the real interpreters and
      # they agree to within 0.01 of a point, so there is no leg where the floor
      # is guesswork. Only the upload is scoped to one leg, to avoid sending the
      # same report twice.
      - name: Hermetic no-regression suite
        # The whole suite, not a hand-picked list. The previous four-file
        # allowlist silently skipped test_solver.py, test_selected_fields.py and
        # others — tests that existed, passed locally, and gated nothing. If a test is too slow or non-hermetic for CI, mark it
        # (`@pytest.mark.skipif`) so the skip is visible in the run output
        # rather than invisible in this file.
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term

      # The upload is the ONLY thing gated on the secret. The threshold above is
      # unconditional: a required check that passes by not running is worse than
      # no check. CODECOV_TOKEN does not exist in this repo yet, and on a fork PR
      # it never will — `pull_request` does not expose secrets to a fork's own
      # run, which is the same reason the driver gate cannot run there. So this
      # step skips, loudly, instead of failing the build over a missing secret.
      - name: Upload coverage to Codecov (python)
        if: ${{ matrix.python-version == '3.12' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: python
          files: coverage.xml
          flags: python
          fail_ci_if_error: true

  js-build:
    name: Solver build (TypeScript)
    runs-on: ubuntu-latest
    needs: codebase-map
    # See the note in python-regression: job level so the `if:` below resolves.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install (skip python bootstrap)
        run: npm ci --ignore-scripts
        env:
          CAPTCHA_KRAKEN_SKIP_PYTHON_SETUP: '1'
      - name: Bundle python engine + type-check
        run: |
          node scripts/copy-python.mjs
          npx tsc --noEmit -p tsconfig.json
      # `npm test` is no longer a synonym for `tsc --noEmit`: it now also runs
      # the node:test suite that pins the 5 < 8 < 10 round-cap ordering against
      # the gateway. A type-check cannot notice a changed integer, and that
      # ordering was previously described as "pinned by a test" when nothing
      # pinned it at all.
      - name: Unit tests (node:test)
        run: npm test

      # STAGE 5 for this port. c8 over the same node:test run, with the floor in
      # .c8rc.json so `npm run coverage` locally enforces what CI does.
      #
      # c8 and node:test rather than Vitest and @vitest/coverage-v8: switching
      # runners means rewriting 30 test files, which is a change to the tests
      # themselves and not something a coverage gate may smuggle in. Recorded in
      # TRIBAL_KNOWLEDGE.md.
      - name: Coverage threshold (c8)
        run: npm run coverage

      - name: Upload coverage to Codecov (js)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: js
          files: coverage/lcov.info
          flags: js
          fail_ci_if_error: true

  mcp-build:
    name: MCP server build (TypeScript)
    runs-on: ubuntu-latest
    needs: codebase-map
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Type-check + build
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm run build
      # The server is only useful if it SPEAKS MCP, and a package that compiles
      # but cannot complete a handshake would ship green. This starts the built
      # binary over stdio, initializes, and asserts tools/list comes back
      # non-empty — the same check A4 was signed off on by hand.
      #
      # No credentials involved: tools/list is answered before any sign-in, so
      # this stays hermetic like the rest of the gate.
      - name: Answers an MCP handshake
        run: node ../.github/scripts/mcp-smoke.mjs node dist/index.js

      # NO COVERAGE GATE HERE, and no coverage number for this package. It has no
      # test suite: its checks are a type-check, a build, and the handshake above.
      # A percentage measured over a smoke test would describe nothing, and
      # inventing one to fill the column is worse than the empty column.
      # TRIBAL_KNOWLEDGE.md records it as the gap it is.
